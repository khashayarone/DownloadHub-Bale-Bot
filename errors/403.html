<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>۴۰۳ - دسترسی ممنوع | DownloadHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .error-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #e53e3e;
            margin-bottom: 10px;
        }
        .error-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
        }
        .error-message {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .home-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: transform 0.3s;
        }
        .home-btn:hover { transform: scale(1.05); }
        .footer {
            margin-top: 30px;
            font-size: 0.7rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">۴۰۳</div>
        <div class="error-title">🔒 دسترسی ممنوع</div>
        <div class="error-message">
            شما مجوز دسترسی به این صفحه را ندارید.<br>
            لطفاً با پشتیبانی تماس بگیرید.
        </div>
        <a href="/downloadhub/" class="home-btn">🏠 بازگشت به صفحه اصلی</a>
        <div class="footer">DownloadHub - ربات دانلودر حرفه‌ای بله</div>
    </div>
</body>
</html>
